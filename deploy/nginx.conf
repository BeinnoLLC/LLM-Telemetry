# Static serving for the LLM telemetry reports on the always-on box.
#
# Why nginx and not the app's own `llm-telemetry serve`:
# the serve command is the nicest option (it also carries the settings
# write-through endpoint) but it needs the project installed, and the hosting
# box is Unraid with Python 3.9 while the project requires 3.10+. Serving the
# built reports from a stock nginx container keeps the deploy to "copy files",
# which is the lightest thing that works on that box.
#
# The one behaviour that MUST be replicated from serve.py is no-store: Python's
# stock http.server sends only Last-Modified, so a browser happily serves a
# stale dashboard.html after a rebuild -- which looks exactly like "the feature
# was never shipped". Every response here is no-store for the same reason.
server {
    listen       8477;
    server_name  _;
    root         /usr/share/nginx/html;

    # no-store on everything: this directory is replaced wholesale on every
    # deploy, and a cached page is indistinguishable from a failed one.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires off;

    # The dashboard polls these every few seconds; they must never be cached.
    location ~* \.(json|html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Directory listing off: the reports dir is a deployment target, not a
    # browsable share.
    autoindex off;

    # The settings page posts to api/settings, which only exists in the app's
    # own server and only accepts loopback writers. On a mirror this is
    # read-only by design, so answer 403 with a body that says so instead of
    # letting the browser show a bare 405 and a console error.
    location /api/ {
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 403 '{"error":"read-only mirror: settings can only be changed on the collecting host"}';
    }
}
