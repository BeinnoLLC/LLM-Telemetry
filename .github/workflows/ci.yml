name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        # jsdom 30 (pinned in tests/package-lock.json) needs Node ^22.22.2,
        # ^24.15 or >=26; on Node 20 several suites crashed, so CI was red.
        with: {node-version: '24'}

      - name: Install
        run: |
          pip install -e .
          # pytest (P3-02, #32): dev-only, never a runtime dependency.
          pip install "pytest>=7.0"
          npm ci --prefix tests          # the pinned jsdom, not whatever is latest

      - name: Leak gate (samples must carry nothing identifying)
        run: python3 examples/check_no_leaks.py

      - name: Render dashboard from committed sample data
        env:
          LLM_TELEMETRY_NO_COLLECT: '1'
          LLM_TELEMETRY_CONFIG: examples/sample-config.json
          # Explicit fixture home: the sample must not depend on whether the
          # runner happens to have a real agent home (P5-06, #55).
          LLM_TELEMETRY_AGENT_HOME: examples/agent-home
        run: python3 -m llm_telemetry.build_dashboard examples/reports/dashboard.html

      - name: Render price sheet from committed sample data
        # Pinned sample catalogue: no network, and the committed sheet is
        # reproducible (P6-05, #63). The DOM suite checks this build.
        env:
          LLM_TELEMETRY_NO_COLLECT: '1'
          LLM_TELEMETRY_CONFIG: examples/sample-config.json
          LLM_TELEMETRY_AGENT_HOME: examples/agent-home
          LLM_TELEMETRY_CATALOG: examples/reports/sample-catalog.json
        run: python3 -m llm_telemetry.build_costs examples/reports/costs.html

      - name: Leak gate on the rendered pages
        run: python3 examples/check_no_leaks.py

      - name: Golden fixture check (P1-03, #25) — payload shape did not silently drift
        env:
          LLM_TELEMETRY_REPORTS: examples/reports
        run: node tests/bless.js --check

      - name: DOM suites
        env:
          LLM_TELEMETRY_REPORTS: examples/reports
          NODE_PATH: tests/node_modules
        run: node tests/run-all.js

      - name: Python suites
        run: python3 -m pytest tests/test_pytest_wrapper.py -v

      - name: Breakpoint screenshots (#21) — non-blocking QA artifact
        # Dev-extra tooling: playwright is never a runtime dependency (the
        # package itself stays PyYAML-only). Uses the runner's preinstalled
        # google-chrome-stable rather than downloading Playwright's own
        # Chromium. continue-on-error so a screenshot-tooling hiccup never
        # blocks a merge — this step exists to attach reviewable images to
        # the PR, not to gate it.
        continue-on-error: true
        run: |
          pip install playwright
          python3 tools/breakpoint_shots.py --out breakpoint-shots --file examples/reports/dashboard.html --chrome "$(which google-chrome-stable || which google-chrome)"
          python3 tools/breakpoint_shots.py --out breakpoint-shots --file examples/reports/costs.html --chrome "$(which google-chrome-stable || which google-chrome)"

      - name: Upload breakpoint screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breakpoint-shots
          path: breakpoint-shots/
          if-no-files-found: ignore
          retention-days: 14
