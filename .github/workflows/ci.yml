name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        # jsdom 30 (pinned in tests/package-lock.json) needs Node ^22.22.2,
        # ^24.15 or >=26; on Node 20 several suites crashed, so CI was red.
        with: {node-version: '24'}

      - name: Install
        run: |
          pip install -e .
          npm ci --prefix tests          # the pinned jsdom, not whatever is latest

      - name: Leak gate (samples must carry nothing identifying)
        run: python3 examples/check_no_leaks.py

      - name: Render dashboard from committed sample data
        env:
          LLM_TELEMETRY_NO_COLLECT: '1'
          LLM_TELEMETRY_CONFIG: examples/sample-config.json
          # Explicit fixture home: the sample must not depend on whether the
          # runner happens to have a real agent home (P5-06, #55).
          LLM_TELEMETRY_AGENT_HOME: examples/agent-home
        run: python3 -m llm_telemetry.build_dashboard examples/reports/dashboard.html

      - name: DOM suites
        env:
          LLM_TELEMETRY_REPORTS: examples/reports
          NODE_PATH: tests/node_modules
        run: node tests/run-all.js

      - name: Python suites
        run: for t in tests/test_*.py; do python3 "$t" || exit 1; done
